name: Update Top Contributor

on:
  push:
    branches:
      - main
    paths:
      - 'public/content/**/*.md'
  workflow_dispatch:
    inputs:
      page:
        description: 'Page to update (e.g., "character/stats" or "equipment/relics")'
        required: true
        type: string

# Only allow one instance to run at a time
concurrency:
  group: update-top-contributor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-top-contributor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Need write permission to create/update top contributor issues

    env:
      WIKI_BOT_USERNAME: slayer-wiki-bot  # Bot service account username
      GITHUB_ACTIONS_BOT: github-actions[bot]  # GitHub Actions bot username
      VITE_RELEASE_DATE: ${{ vars.VITE_RELEASE_DATE }}  # Release date for filtering commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate commit analysis

      - name: Detect changed files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use the input page
            PAGE_INPUT="${{ github.event.inputs.page }}"
            echo "Manual trigger for page: $PAGE_INPUT"

            # Convert page input to file path (e.g., "character/stats" -> "public/content/character/stats.md")
            FILE_PATH="public/content/${PAGE_INPUT}.md"

            # Check if file exists
            if [ ! -f "$FILE_PATH" ]; then
              echo "Error: File not found: $FILE_PATH"
              exit 1
            fi

            CHANGED_FILES="$FILE_PATH"
          else
            # Automatic trigger - get changed files from push
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^public/content/.*\.md$' || true)
          fi

          echo "Changed content files:"
          echo "$CHANGED_FILES"

          # Save to output for processing
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate and update top contributors
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const BOT_USERNAME = process.env.WIKI_BOT_USERNAME || 'slayer-wiki-bot';
            const GITHUB_ACTIONS_BOT = process.env.GITHUB_ACTIONS_BOT || 'github-actions[bot]';
            const CONTENT_PATH = 'public/content';

            // Scoring weights (must match StarContributor.jsx)
            const COMMIT_WEIGHT = 10;
            const ADDITION_WEIGHT = 0.5;
            const DELETION_WEIGHT = 0.5;

            // Read release date from environment variable
            let releaseDate = null; // null = no filtering
            const releaseDateStr = process.env.VITE_RELEASE_DATE;
            if (releaseDateStr && releaseDateStr.trim() !== '') {
              releaseDate = new Date(releaseDateStr);
              if (isNaN(releaseDate.getTime())) {
                console.warn('⚠️ Invalid VITE_RELEASE_DATE format:', releaseDateStr);
                releaseDate = null;
              } else {
                console.log(`📅 Release date configured: ${releaseDate.toISOString()}`);
                console.log(`   Only commits after this date will be counted`);
              }
            }

            /**
             * Filter commits by release date
             * @param {Array} commits - Array of commits to filter
             * @returns {Array} Filtered commits after release date
             */
            function filterByReleaseDate(commits) {
              if (!releaseDate) return commits;

              const beforeCount = commits.length;
              const filtered = commits.filter(commit => {
                const commitDate = new Date(commit.commit.author.date);
                return commitDate >= releaseDate;
              });

              const filteredCount = beforeCount - filtered.length;
              if (filteredCount > 0) {
                console.log(`   📅 Filtered out ${filteredCount} commit(s) before release date`);
              }

              return filtered;
            }

            /**
             * Calculate top contributor for a page
             */
            async function calculateTopContributor(sectionId, pageId) {
              console.log(`[TopContributor] Calculating top contributor for ${sectionId}/${pageId}...`);

              const filePath = `${CONTENT_PATH}/${sectionId}/${pageId}.md`;

              try {
                // Fetch ALL commits for the file (with pagination)
                console.log(`[TopContributor] Fetching commits for ${filePath}...`);

                let commitList = [];
                let page = 1;
                const perPage = 100;

                while (true) {
                  const { data: commits } = await github.rest.repos.listCommits({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: filePath,
                    per_page: perPage,
                    page: page,
                  });

                  commitList.push(...commits);
                  console.log(`[TopContributor] Fetched page ${page}: ${commits.length} commits`);

                  if (commits.length < perPage) {
                    break; // Last page
                  }

                  page++;
                }

                console.log(`[TopContributor] Found ${commitList.length} total commits`);

                // Filter commits by release date
                const filteredCommitList = filterByReleaseDate(commitList);
                console.log(`[TopContributor] After release date filter: ${filteredCommitList.length} commits`);

                if (filteredCommitList.length === 0) {
                  console.log('[TopContributor] No commits found after filtering - returning null');
                  return null;
                }

                // Fetch detailed commit info including stats in parallel
                console.log('[TopContributor] Fetching commit details...');
                const commitsWithStats = await Promise.all(
                  filteredCommitList.map(async (commit) => {
                    try {
                      const { data: commitDetails } = await github.rest.repos.getCommit({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        ref: commit.sha,
                      });

                      // Extract stats for the specific file
                      const fileStats = commitDetails.files?.find(file => file.filename === filePath);
                      const stats = fileStats ? {
                        additions: fileStats.additions || 0,
                        deletions: fileStats.deletions || 0,
                        total: fileStats.changes || 0,
                      } : {
                        additions: 0,
                        deletions: 0,
                        total: 0,
                      };

                      return {
                        sha: commit.sha,
                        message: commit.commit.message,
                        author: {
                          name: commit.commit.author.name,
                          email: commit.commit.author.email,
                          username: commit.author?.login,
                          userId: commit.author?.id,
                        },
                        stats,
                      };
                    } catch (err) {
                      console.error(`Failed to fetch stats for commit ${commit.sha}:`, err);
                      return null;
                    }
                  })
                );

                const commits = commitsWithStats.filter(c => c !== null);

                // Calculate contributor scores
                console.log('[TopContributor] Calculating scores...');
                const contributorScores = {};

                // Get repository owner to exclude their commits
                const { data: repoData } = await github.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                const repoOwner = repoData.owner.login;
                console.log(`[TopContributor] Repository owner: ${repoOwner}`);
                console.log(`[TopContributor] Wiki bot: ${BOT_USERNAME}`);
                console.log(`[TopContributor] Processing ${commits.length} commits...`);

                let processedCount = 0;
                let skippedCount = 0;

                commits.forEach((commit) => {
                  const username = commit.author.username;
                  const userId = commit.author.userId;

                  // Skip commits without GitHub user (local commits)
                  if (!username || !userId) {
                    console.log(`[TopContributor] Skipping commit without GitHub user: ${commit.sha.substring(0, 7)}`);
                    skippedCount++;
                    return;
                  }

                  // Skip repository owner commits
                  if (username === repoOwner) {
                    console.log(`[TopContributor] Skipping repository owner commit: ${username} (${commit.sha.substring(0, 7)})`);
                    skippedCount++;
                    return;
                  }

                  // Skip wiki bot
                  if (username === BOT_USERNAME) {
                    console.log(`[TopContributor] Skipping wiki bot commit: ${BOT_USERNAME} (${commit.sha.substring(0, 7)})`);
                    skippedCount++;
                    return;
                  }

                  // Skip GitHub Actions bot
                  if (username === GITHUB_ACTIONS_BOT) {
                    console.log(`[TopContributor] Skipping GitHub Actions bot commit: ${commit.sha.substring(0, 7)}`);
                    skippedCount++;
                    return;
                  }

                  processedCount++;

                  const stats = commit.stats || { additions: 0, deletions: 0, total: 0 };

                  // Calculate weighted score
                  const score =
                    (COMMIT_WEIGHT) +
                    (stats.additions * ADDITION_WEIGHT) +
                    (stats.deletions * DELETION_WEIGHT);

                  // Initialize contributor if not exists
                  if (!contributorScores[userId]) {
                    contributorScores[userId] = {
                      username,
                      userId,
                      score: 0,
                      commits: 0,
                      additions: 0,
                      deletions: 0,
                    };
                  }

                  // Update contributor stats
                  contributorScores[userId].score += score;
                  contributorScores[userId].commits += 1;
                  contributorScores[userId].additions += stats.additions;
                  contributorScores[userId].deletions += stats.deletions;
                });

                console.log(`[TopContributor] Processing complete: ${processedCount} commits counted, ${skippedCount} commits skipped`);

                // Find top contributor
                const contributors = Object.values(contributorScores);

                console.log(`[TopContributor] Found ${contributors.length} unique contributor(s)`);
                if (contributors.length > 0) {
                  console.log('[TopContributor] Contributors:', contributors.map(c => `${c.username} (${c.commits} commits, score: ${c.score.toFixed(2)})`).join(', '));
                }

                if (contributors.length === 0) {
                  console.log('[TopContributor] No community contributors found - returning null');
                  return null;
                }

                contributors.sort((a, b) => b.score - a.score);
                const topContributor = contributors[0];

                console.log(`[TopContributor] Top contributor: ${topContributor.username} (ID: ${topContributor.userId}, score: ${topContributor.score.toFixed(2)})`);
                console.log(`[TopContributor]   - Commits: ${topContributor.commits}`);
                console.log(`[TopContributor]   - Additions: ${topContributor.additions}`);
                console.log(`[TopContributor]   - Deletions: ${topContributor.deletions}`);

                return {
                  username: topContributor.username,
                  userId: topContributor.userId,
                  score: Math.round(topContributor.score * 100) / 100,
                  updatedAt: new Date().toISOString(),
                };
              } catch (error) {
                console.error('[TopContributor] Failed to calculate:', error);
                throw error;
              }
            }

            /**
             * Get the current branch from wiki-config.json
             */
            function getCurrentBranch() {
              try {
                const fs = require('fs');
                const path = require('path');
                const configPath = path.join(process.env.GITHUB_WORKSPACE, 'wiki-config.json');
                const configContent = fs.readFileSync(configPath, 'utf8');
                const config = JSON.parse(configContent);
                return config?.wiki?.repository?.branch || 'main';
              } catch (error) {
                console.warn('[TopContributor] Failed to read wiki-config.json, using default branch: main');
                return 'main';
              }
            }

            /**
             * Update or create top contributor issue
             */
            async function updateTopContributorIssue(sectionId, pageId, contributorData) {
              console.log(`[TopContributor] updateTopContributorIssue called for ${sectionId}/${pageId}`);

              const pageIdentifier = `${sectionId}/${pageId}`;
              const issueTitle = `[Top Contributor] ${pageIdentifier}`;
              const issueLabel = 'top-contributor';
              const branch = getCurrentBranch();
              const branchLabel = `branch:${branch}`;
              const pageIdLabel = `page:${pageIdentifier}`; // Unique label per page

              console.log(`[TopContributor] Using labels: "${issueLabel}", "${branchLabel}", "${pageIdLabel}"`);

              try {
                // Find existing issue (search by page-specific label for fast lookup)
                console.log(`[TopContributor] Searching for existing issue...`);
                const { data: issues } = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: `${issueLabel},${branchLabel},${pageIdLabel}`,
                  per_page: 1 // Only need 1 result since page label is unique
                });

                console.log(`[TopContributor] Search returned ${issues.length} issue(s)`);
                const existingIssue = issues.find(issue => issue.title === issueTitle);

                const issueBody = JSON.stringify(contributorData, null, 2);

                if (existingIssue) {
                  // Update existing issue
                  console.log(`[TopContributor] Updating existing issue #${existingIssue.number}`);
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: existingIssue.number,
                    body: issueBody
                  });
                  return existingIssue.number;
                } else {
                  // Create new issue
                  console.log('[TopContributor] Creating new issue');
                  const { data: newIssue } = await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issueTitle,
                    body: issueBody,
                    labels: [issueLabel, branchLabel, pageIdLabel, 'automated']
                  });

                  // Lock the issue to prevent comments
                  try {
                    await github.rest.issues.lock({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: newIssue.number,
                      lock_reason: 'off-topic'
                    });
                    console.log(`[TopContributor] Locked issue #${newIssue.number}`);
                  } catch (lockError) {
                    console.warn('[TopContributor] Failed to lock issue:', lockError.message);
                  }

                  return newIssue.number;
                }
              } catch (error) {
                console.error('[TopContributor] Failed to update issue:', error);
                throw error;
              }
            }

            // Parse changed files from previous step
            const changedFilesOutput = `${{ steps.changed-files.outputs.files }}`;
            const changedFiles = changedFilesOutput.split('\n').filter(f => f.trim());

            console.log('==========================================');
            console.log(`Processing ${changedFiles.length} changed file(s)`);
            console.log('==========================================');
            console.log('');

            let succeeded = 0;
            let failed = 0;

            // Process each changed file
            for (const file of changedFiles) {
              if (!file || !file.trim()) continue;

              // Extract section and page from path
              const sectionMatch = file.match(/public\/content\/([^\/]+)\//);
              const pageMatch = file.match(/public\/content\/[^\/]+\/(.+)\.md/);

              if (!sectionMatch || !pageMatch) {
                console.log(`Skipping invalid path: ${file}`);
                failed++;
                continue;
              }

              const section = sectionMatch[1];
              const page = pageMatch[1];

              console.log(`Processing: ${section}/${page}`);

              try {
                // Calculate top contributor
                const topContributor = await calculateTopContributor(section, page);

                if (!topContributor) {
                  console.log(`  ℹ️  No top contributor to update (no commits or no valid contributors)`);
                  succeeded++;
                } else {
                  // Update issue
                  const issueNumber = await updateTopContributorIssue(section, page, topContributor);
                  console.log(`  ✓ Success: Updated issue #${issueNumber}`);
                  succeeded++;
                }
              } catch (error) {
                console.error(`  ✗ Failed: ${error.message}`);
                failed++;
              }

              console.log('');
            }

            console.log('==========================================');
            console.log('✅ Top contributor updates completed');
            console.log(`Succeeded: ${succeeded}`);
            console.log(`Failed: ${failed}`);
            console.log('==========================================');

            // Don't fail the workflow if some files failed
            // This allows other files to still be processed

      - name: Summary
        if: always()
        run: |
          echo "### Top Contributor Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "**Trigger:** Manual (workflow_dispatch)" >> $GITHUB_STEP_SUMMARY
            echo "**Page:** ${{ github.event.inputs.page }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger:** Automatic (push)" >> $GITHUB_STEP_SUMMARY
            echo "**Changed files:** ${{ steps.changed-files.outputs.files && 'See above' || 'None' }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Top contributor data has been calculated and stored in GitHub issues." >> $GITHUB_STEP_SUMMARY
