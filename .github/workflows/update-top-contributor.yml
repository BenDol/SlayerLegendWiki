name: Update Top Contributor

on:
  push:
    branches:
      - main
    paths:
      - 'public/content/**/*.md'

# Only allow one instance to run at a time
concurrency:
  group: update-top-contributor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-top-contributor:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate commit analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect changed files
        id: changed-files
        run: |
          # Get list of changed content files in the push
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^public/content/.*\.md$' || true)

          echo "Changed content files:"
          echo "$CHANGED_FILES"

          # Save to output for processing
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate and update top contributors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_BOT_TOKEN: ${{ secrets.WIKI_BOT_TOKEN }}
          WIKI_BOT_USERNAME: slayer-wiki-bot
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CONTENT_PATH: 'public/content'
          BOT_SERVICE_URL: ${{ vars.BOT_SERVICE_URL || secrets.BOT_SERVICE_URL }}
        run: |
          # Process each changed file
          echo "${{ steps.changed-files.outputs.files }}" | while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi

            # Extract section and page from path: public/content/<section>/<page>.md
            SECTION=$(echo "$file" | sed 's|public/content/\([^/]*\)/.*|\1|')
            PAGE=$(echo "$file" | sed 's|public/content/[^/]*/\(.*\)\.md|\1|')

            echo "Processing: $SECTION/$PAGE"

            # Skip if file was deleted
            if [ ! -f "$file" ]; then
              echo "  Skipped (file deleted)"
              continue
            fi

            # Run top contributor calculation
            node scripts/calculate-top-contributor.js "$SECTION" "$PAGE" || {
              echo "  ⚠️ Warning: Failed to calculate top contributor"
              # Continue with other files even if one fails
              continue
            }

            echo "  ✓ Completed"
          done

          echo "✅ Top contributor updates completed"

      - name: Summary
        if: always()
        run: |
          echo "### Top Contributor Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Changed files:** ${{ steps.changed-files.outputs.files && 'See above' || 'None' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Top contributor data has been calculated and stored in GitHub issues." >> $GITHUB_STEP_SUMMARY
