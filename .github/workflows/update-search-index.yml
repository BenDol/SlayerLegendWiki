name: Update Search Index

on:
  push:
    branches:
      - main
    paths:
      - 'public/content/**/*.md'
      - 'scripts/buildSearchIndex.js'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-search-index:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.WIKI_BOT_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if search index needs update
        id: check_changes
        run: |
          # Check if content files or build script changed
          if git diff --name-only HEAD~1 HEAD | grep -E '(public/content/.*\.md|scripts/buildSearchIndex\.js)'; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Build search index
        if: steps.check_changes.outputs.needs_update == 'true'
        run: npm run build:search

      - name: Check for changes in search index
        if: steps.check_changes.outputs.needs_update == 'true'
        id: check_index_changes
        run: |
          if git diff --quiet public/search-index.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated search index
        if: steps.check_changes.outputs.needs_update == 'true' && steps.check_index_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/search-index.json
          git commit -m "Update search index [skip ci]"

      - name: Push changes
        if: steps.check_changes.outputs.needs_update == 'true' && steps.check_index_changes.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.WIKI_BOT_TOKEN }}
          branch: main

      - name: Log result
        run: |
          if [ "${{ steps.check_changes.outputs.needs_update }}" == "true" ]; then
            if [ "${{ steps.check_index_changes.outputs.has_changes }}" == "true" ]; then
              echo "✅ Search index updated and committed"
            else
              echo "✅ Search index rebuilt (no changes detected)"
            fi
          else
            echo "⏭️  No content changes, search index not rebuilt"
          fi
